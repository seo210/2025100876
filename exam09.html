<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기 과제 완성</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        h1 { text-align: center; }
        #calc { width: 220px; margin: 0 auto; text-align: center; }
        .disp { width: 205px; margin-bottom: 5px; text-align: right; font-size: 16px; }
    </style>
    <script>
      $(document).ready(function(){
          $('.num').click(function(){
              let cur = $('#disp2').val();
              let n = $(this).val();
              $('#disp2').val(cur + n);
          });
          $('.op').click(function(){
              let cur = $('#disp2').val();
              let opt = $(this).val();
               if( opt != "=" ) {
                  $('#disp2').val(cur + opt);
              }
              else {
                  try {
                      $('#disp1').val(cur);
                      let result = Function('"use strict"; return (' + cur + ')')();
                        $('#disp2').val(result);
                  } catch (error) {
                      $('#disp2').val('Error');
                  }
              }
          });$('.func').click(function(){
            
              $('#disp1').val('');
              $('#disp2').val('');
          });
      });
    </script>
</head>
<body>
    <h1>계산기</h1>
    <div id="calc">
        <div>
            <input type="text" class="disp" id="disp1" readonly><br>
            <input type="text" class="disp" id="disp2" readonly>
        </div>
        <div style="margin-top: 10px;">
            <input type="button" class="num" value="7">
            <input type="button" class="num" value="8">
            <input type="button" class="num" value="9">
            <input type="button" class="op" value="*"><br>

            <input type="button" class="num" value="4">
            <input type="button" class="num" value="5">
            <input type="button" class="num" value="6">
            <input type="button" class="op" value="-"><br>

            <input type="button" class="num" value="1">
            <input type="button" class="num" value="2">
            <input type="button" class="num" value="3">
            <input type="button" class="op" value="+"><br>

            <input type="button" class="func" value="AC">
            <input type="button" class="num" value="0">
            <input type="button" class="op" value="=">
            <input type="button" class="op" value="/">
        </div>
    </div>
</body>
</html>
