<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구구단 출력</title>
</head>
<body>
 <h2>2단 ~ 9단 구구단</h2>
    
    <div class="gugudan-container">
        <script>
            // 외부 for문: 2단부터 9단까지 단수(i) 반복
            for (let i = 2; i <= 9; i++) {
                document.write("<div class='dan-box'>");
                document.write("<div class='dan-title'>" + i + "단</div>");
                
                // 내부 for문: 각 단마다 1부터 9까지 곱하는 수(j) 반복
                for (let j = 1; j <= 9; j++) {
                    document.write(i + " x " + j + " = " + (i * j) + "<br>");
                }
                
                document.write("</div>");
            }
        </script>
    </div>
</body>
</html>
